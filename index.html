<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bralnik – prototip</title>
  <meta name="theme-color" content="#1d1b22">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@300;400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/opendyslexic" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="krem">
  <header class="top">
    <div class="brand">Bralnik <span class="tag">prototip</span></div>
    <div class="top-actions">
      <button id="btnEdit" class="ghost" title="Novo besedilo">Novo besedilo</button>
      <button id="btnSettings" class="icon" title="Nastavitve" aria-label="Nastavitve">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm8.9 4.6-.1-1.1 1.9-1.5-2-3.4-2.3.9c-.6-.5-1.2-.8-1.9-1.1L16 4.5h-4l-.4 2.4c-.7.3-1.3.6-1.9 1.1l-2.3-.9-2 3.4L7.3 12l-.1 1.1L5.3 14.6l2 3.4 2.3-.9c.6.5 1.2.8 1.9 1.1l.4 2.4h4l.4-2.4c.7-.3 1.3-.6 1.9-1.1l2.3.9 2-3.4-1.9-1.5Z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <!-- Vnos besedila -->
    <section id="viewInput" class="view">
      <h1>Kaj bova brala?</h1>
      <p class="hint">Prilepi besedilo iz učbenika, zapiskov ali e-pošte.</p>
      <textarea id="inputText" spellcheck="false" placeholder="Prilepi besedilo sem …"></textarea>
      <div class="row">
        <button id="btnSample" class="ghost">Primer iz kemije</button>
        <button id="btnStart" class="primary">Beri</button>
      </div>
    </section>

    <!-- Bralnik -->
    <section id="viewReader" class="view hidden">
      <article id="readerText" class="reader" aria-live="off"></article>
    </section>
  </main>

  <!-- Stanje modela -->
  <div id="status" class="status hidden">
    <div class="status-text" id="statusText">Pripravljam glas …</div>
    <div class="bar"><div id="statusBar"></div></div>
  </div>

  <!-- Spodnja vrstica za predvajanje -->
  <nav id="controls" class="controls hidden">
    <button id="btnPrev" class="icon" aria-label="Prejšnji stavek">
      <svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M6 6h2v12H6zM9.5 12 18 6v12z"/></svg>
    </button>
    <button id="btnPlay" class="play" aria-label="Predvajaj">
      <svg id="icoPlay" viewBox="0 0 24 24" width="34" height="34"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
      <svg id="icoPause" class="hidden" viewBox="0 0 24 24" width="34" height="34"><path fill="currentColor" d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
    </button>
    <button id="btnNext" class="icon" aria-label="Naslednji stavek">
      <svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
    </button>
    <div class="speed">
      <button id="btnSlower" class="chip" aria-label="Počasneje">−</button>
      <span id="speedLabel">1,0×</span>
      <button id="btnFaster" class="chip" aria-label="Hitreje">+</button>
    </div>
  </nav>

  <!-- Nastavitve -->
  <aside id="settings" class="drawer hidden" aria-label="Nastavitve">
    <div class="drawer-head">
      <h2>Nastavitve</h2>
      <button id="btnCloseSettings" class="icon" aria-label="Zapri">✕</button>
    </div>

    <h3>Glas</h3>
    <label>Glas
      <select id="setVoice">
        <option value="F1">Ženski 1</option><option value="F2">Ženski 2</option><option value="F3">Ženski 3</option>
        <option value="F4">Ženski 4</option><option value="F5">Ženski 5</option>
        <option value="M1">Moški 1</option><option value="M2">Moški 2</option><option value="M3">Moški 3</option>
        <option value="M4">Moški 4</option><option value="M5">Moški 5</option>
      </select>
    </label>
    <label>Hitrost branja <output id="outSpeed"></output>
      <input id="setSpeed" type="range" min="0.7" max="2" step="0.05">
    </label>
    <label>Kakovost glasu
      <select id="setSteps">
        <option value="3">Hitro</option><option value="5">Uravnoteženo</option><option value="8">Najboljša</option>
      </select>
    </label>

    <h3>Označevanje</h3>
    <div class="swatches" id="swatches"></div>
    <label>Lastna barva <input id="setColor" type="color"></label>
    <label>Prosojnost <output id="outOpacity"></output>
      <input id="setOpacity" type="range" min="0.1" max="1" step="0.05">
    </label>
    <label class="check"><input id="setSentence" type="checkbox"> Rahlo označi tudi stavek</label>
    <label class="check"><input id="setFollow" type="checkbox"> Besedilo sledi branju</label>

    <h3>Besedilo</h3>
    <label>Pisava
      <select id="setFont">
        <option value="Lexend">Lexend</option>
        <option value="Atkinson Hyperlegible">Atkinson Hyperlegible</option>
        <option value="OpenDyslexic">OpenDyslexic</option>
        <option value="system-ui">Sistemska</option>
      </select>
    </label>
    <label>Velikost <output id="outSize"></output>
      <input id="setSize" type="range" min="16" max="40" step="1">
    </label>
    <label>Razmik vrstic <output id="outLine"></output>
      <input id="setLine" type="range" min="1.3" max="2.6" step="0.1">
    </label>
    <label>Razmik črk <output id="outLetter"></output>
      <input id="setLetter" type="range" min="0" max="0.15" step="0.01">
    </label>
    <label>Ozadje
      <select id="setTheme">
        <option value="krem">Krem</option><option value="svetla">Svetlo</option>
        <option value="modra">Modrikasto</option><option value="temna">Temno</option>
      </select>
    </label>

    <p class="tech" id="techInfo"></p>
  </aside>
  <div id="scrim" class="scrim hidden"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
